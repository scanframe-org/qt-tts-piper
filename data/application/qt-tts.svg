<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"
     xmlns:c2pa="http://c2pa.org/manifest">
    <metadata>
        <c2pa:manifest>
            
        </c2pa:manifest>
    </metadata>
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4F8EF7"/>
            <stop offset="100%" stop-color="#1E5FCC"/>
        </linearGradient>
        <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#EAF1FF"/>
        </linearGradient>
    </defs>

    <!-- Background rounded square -->
    <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGrad)"/>

    <!-- Speech bubble -->
    <path d="
    M 60 76
    Q 60 56 80 56
    L 176 56
    Q 196 56 196 76
    L 196 138
    Q 196 158 176 158
    L 108 158
    L 78 186
    L 82 158
    L 80 158
    Q 60 158 60 138
    Z"
          fill="url(#bubbleGrad)" stroke="#1E5FCC" stroke-width="3"/>

    <!-- Sound wave bars (representing speech/TTS) -->
    <g fill="#1E5FCC">
        <rect x="86" y="96" width="10" height="24" rx="5"/>
        <rect x="106" y="84" width="10" height="48" rx="5"/>
        <rect x="126" y="72" width="10" height="72" rx="5"/>
        <rect x="146" y="88" width="10" height="40" rx="5"/>
        <rect x="166" y="100" width="10" height="16" rx="5"/>
    </g>

    <!-- Small "sound emanating" arcs to reinforce TTS/voice concept -->
    <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
        <path d="M 206 100 Q 216 112 206 124"/>
        <path d="M 216 90 Q 232 112 216 134"/>
    </g>
</svg>
